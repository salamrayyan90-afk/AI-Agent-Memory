<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE AI | Intelligence Hub</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: sans-serif; }
        #canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
        .logo { width: 220px; margin-bottom: 30px; filter: drop-shadow(0 0 15px rgba(0, 128, 128, 0.6)); mix-blend-mode: normal !important; }
        .search-container { background: rgba(255, 255, 255, 0.05); padding: 5px 15px; border-radius: 50px; display: flex; align-items: center; width: 85%; max-width: 600px; backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input { background: none; border: none; color: white; flex: 1; padding: 15px; outline: none; font-size: 18px; }
        button { background: #008080; border: none; color: white; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00a8a8; transform: scale(1.05); }
        #response-area { margin-top: 30px; width: 85%; max-width: 600px; text-align: center; color: #ccc; font-size: 18px; line-height: 1.6; }
        .status { color: #00d1d1; font-style: italic; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui-container">
        <img src="logo.png" alt="CORE AI" class="logo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Ask CORE AI anything..." onkeypress="if(event.key==='Enter') sendRequest()">
            <button onclick="sendRequest()">Send</button>
        </div>
        <div id="response-area"></div>
    </div>
    <script>
        async function sendRequest() {
            const input = document.getElementById('searchInput');
            const resArea = document.getElementById('response-area');
            const message = input.value.trim();
            if (!message) return;
            resArea.innerHTML = '<span class="status">Analyzing...</span>';
            input.value = "";
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                resArea.innerText = data.reply;
            } catch (error) {
                resArea.innerHTML = '<span style="color: #ff4b4b;">Connection Error. Check Vercel logs.</span>';
            }
        }
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 2; }
            update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvas.width) this.vx *= -1; if (this.y < 0 || this.y > canvas.height) this.vy *= -1; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 128, 128, 0.4)'; ctx.fill(); }
        }
        for (let i = 0; i < 80; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
