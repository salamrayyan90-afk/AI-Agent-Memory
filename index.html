<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE AI | المحرك الذكي</title>
    <style>
        /* التنسيق الأساسي لضمان ملء الشاشة 100% */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        #canvas { 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }

        .ui-container { 
            position: relative; z-index: 2; display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; color: white; 
            pointer-events: none; /* للسماح بالتفاعل مع الخلفية عند الحاجة */
        }

        .content-box {
            pointer-events: auto; /* لإعادة التفاعل مع عناصر الإدخال */
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .logo { 
            width: 180px; margin-bottom: 30px; 
            filter: drop-shadow(0 0 15px rgba(0, 128, 128, 0.6));
        }

        .search-container { 
            background: rgba(255, 255, 255, 0.07); 
            padding: 5px 15px; border-radius: 50px; 
            display: flex; align-items: center; 
            width: 85%; max-width: 650px; 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        input { 
            background: none; border: none; color: white; 
            flex: 1; padding: 15px; outline: none; 
            font-size: 18px; text-align: right;
        }

        button { 
            background: #008080; border: none; color: white; 
            padding: 12px 25px; border-radius: 25px; 
            cursor: pointer; transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover { 
            background: #00a8a8; transform: scale(1.05); 
        }

        #response-area { 
            margin-top: 30px; width: 85%; max-width: 650px; 
            text-align: center; font-size: 18px; line-height: 1.6; 
            color: #e0e0e0; min-height: 50px;
            padding: 20px; border-radius: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .loading { color: #00d1d1; font-style: italic; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <div class="content-box">
            <img src="logo.png" alt="CORE AI" class="logo">
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="اسأل CORE AI عن أي شيء..." onkeypress="if(event.key==='Enter') sendRequest()">
                <button onclick="sendRequest()">إرسال</button>
            </div>

            <div id="response-area"></div>
        </div>
    </div>

    <script>
        // --- 1. محرك الربط مع API Vercel (بدون Alert) ---
        async function sendRequest() {
            const input = document.getElementById('searchInput');
            const responseArea = document.getElementById('response-area');
            const message = input.value.trim();

            if (!message) return;

            responseArea.innerHTML = '<span class="loading">جاري التفكير...</span>';
            const originalValue = message;
            input.value = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: originalValue })
                });

                if (!response.ok) throw new Error('فشل السيرفر');

                const data = await response.json();
                responseArea.innerText = data.reply;
            } catch (error) {
                responseArea.innerHTML = '<span style="color: #ff4b4b;">خطأ: تأكد من إضافة GROQ_API_KEY في إعدادات Vercel.</span>';
                console.error('Error:', error);
            }
        }

        // --- 2. محرك الفيزياء (Physics Background) لضمان الحركة الفخمة ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 128, 128, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 120; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // رسم خطوط بسيطة بين الجسيمات القريبة لزيادة الجمالية
            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for(let j=i+1; j<particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 128, 128, ${0.1 * (1 - dist/100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
