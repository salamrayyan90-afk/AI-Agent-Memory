<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE AI | المحرك الذكي</title>
    <style>
        /* التنسيق الأساسي لملء الشاشة */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        #canvas { 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }

        .ui-container { 
            position: relative; z-index: 2; display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; color: white; 
            background: rgba(0, 0, 0, 0.2);
        }

        .logo { 
            width: 180px; margin-bottom: 30px; 
            filter: drop-shadow(0 0 10px rgba(0, 128, 128, 0.5));
        }

        .search-container { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 5px 15px; border-radius: 50px; 
            display: flex; align-items: center; 
            width: 85%; max-width: 650px; 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        input { 
            background: none; border: none; color: white; 
            flex: 1; padding: 15px; outline: none; 
            font-size: 18px; text-align: right;
        }

        button { 
            background: #008080; border: none; color: white; 
            padding: 12px 25px; border-radius: 25px; 
            cursor: pointer; transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover { 
            background: #00a8a8; transform: scale(1.05); 
        }

        #response-area { 
            margin-top: 30px; width: 85%; max-width: 650px; 
            text-align: center; font-size: 18px; line-height: 1.6; 
            color: #ccc; min-height: 50px;
            padding: 20px; border-radius: 15px;
        }

        /* تأثير جاري التفكير */
        .loading { color: #008080; font-style: italic; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <img src="logo.png" alt="CORE AI" class="logo">
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="اسأل CORE AI عن أي شيء..." onkeypress="handleKeyPress(event)">
            <button onclick="sendRequest()">إرسال</button>
        </div>

        <div id="response-area"></div>
    </div>

    <script>
        // --- 1. محرك الربط مع API Vercel ---
        async function sendRequest() {
            const input = document.getElementById('searchInput');
            const responseArea = document.getElementById('response-area');
            const message = input.value.trim();

            if (!message) return;

            // تحديث الواجهة لبدء المعالجة
            responseArea.innerHTML = '<span class="loading">جاري التفكير في رد مناسب...</span>';
            input.value = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error('فشل الاتصال بالسيرفر');

                const data = await response.json();
                responseArea.innerText = data.reply;
            } catch (error) {
                responseArea.innerHTML = '<span style="color: #ff4b4b;">حدث خطأ: تأكد من إعداد مفاتيح API في Vercel بشكل صحيح.</span>';
                console.error('Error:', error);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendRequest();
        }

        // --- 2. محرك الفيزياء (Physics Background) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 128, 128, 0.5)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
